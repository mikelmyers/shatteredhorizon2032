; Shattered Horizon 2032 — Scalability buckets (Wave 0 foundation)
; -----------------------------------------------------------------------------
; The "Low/High split" that keeps the project playable on the dev box
; (i5-8400 / Intel UHD630) while letting mid/high PC + console hit the AAA look.
;
;   LOW  (sg.* = 0/1): baked static lighting, Lumen OFF, reflections OFF/SSR,
;                      reduced shadows/foliage/view-distance. Target: dev box floor.
;   HIGH (sg.* = 3 Epic): Lumen GI + reflections, full shadows/foliage. Target: 3060+/console.
;
; Apply at runtime via the engine scalability groups (sg.GlobalIlluminationQuality, etc.)
; or force on launch, e.g.:  -sg.GlobalIlluminationQuality=0 -sg.ShadowQuality=1 ...
; The map itself carries BAKED lighting so LOW looks good with Lumen disabled.
; =============================================================================

; ----- Global Illumination / Reflections: this is the Lumen on/off switch -----
[GlobalIlluminationQuality@0]
r.DynamicGlobalIlluminationMethod=0   ; None — rely on baked static lighting
r.Lumen.DiffuseIndirect.Allow=0
r.ReflectionMethod=0                  ; None

[GlobalIlluminationQuality@1]
r.DynamicGlobalIlluminationMethod=0   ; None (baked) — dev-box LOW path
r.Lumen.DiffuseIndirect.Allow=0
r.ReflectionMethod=1                  ; SSR (cheap)

[GlobalIlluminationQuality@2]
r.DynamicGlobalIlluminationMethod=1   ; Lumen (software)
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.TraceMeshSDFs=0               ; global-distance-field tracing (cheaper)
r.ReflectionMethod=1                  ; SSR

[GlobalIlluminationQuality@3]
r.DynamicGlobalIlluminationMethod=1   ; Lumen (full) — HIGH path
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.TraceMeshSDFs=1
r.ReflectionMethod=2                  ; Lumen reflections

[GlobalIlluminationQuality@Cine]
r.DynamicGlobalIlluminationMethod=1
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.TraceMeshSDFs=1
r.ReflectionMethod=2

; ----- Shadows -----
[ShadowQuality@0]
r.ShadowQuality=1
r.Shadow.CSM.MaxCascades=1
r.Shadow.MaxResolution=512
r.Shadow.DistanceScale=0.6
r.Shadow.Virtual.Enable=0             ; VSM off on LOW

[ShadowQuality@1]
r.ShadowQuality=2
r.Shadow.CSM.MaxCascades=2
r.Shadow.MaxResolution=1024
r.Shadow.DistanceScale=0.7
r.Shadow.Virtual.Enable=0

[ShadowQuality@2]
r.ShadowQuality=3
r.Shadow.CSM.MaxCascades=3
r.Shadow.MaxResolution=2048
r.Shadow.DistanceScale=0.85
r.Shadow.Virtual.Enable=1

[ShadowQuality@3]
r.ShadowQuality=5
r.Shadow.CSM.MaxCascades=4
r.Shadow.MaxResolution=2048
r.Shadow.DistanceScale=1.0
r.Shadow.Virtual.Enable=1             ; VSM on HIGH

[ShadowQuality@Cine]
r.ShadowQuality=5
r.Shadow.Virtual.Enable=1

; ----- View distance -----
[ViewDistanceQuality@0]
r.ViewDistanceScale=0.5
[ViewDistanceQuality@1]
r.ViewDistanceScale=0.7
[ViewDistanceQuality@2]
r.ViewDistanceScale=0.9
[ViewDistanceQuality@3]
r.ViewDistanceScale=1.0
[ViewDistanceQuality@Cine]
r.ViewDistanceScale=1.0

; ----- Foliage / effects density -----
[FoliageQuality@0]
foliage.DensityScale=0.4
grass.DensityScale=0.4
[FoliageQuality@1]
foliage.DensityScale=0.6
grass.DensityScale=0.6
[FoliageQuality@2]
foliage.DensityScale=0.85
grass.DensityScale=0.85
[FoliageQuality@3]
foliage.DensityScale=1.0
grass.DensityScale=1.0
[FoliageQuality@Cine]
foliage.DensityScale=1.0
grass.DensityScale=1.0

; ----- Resolution scale (screen percentage) -----
[ResolutionQuality@0]
r.ScreenPercentage=66                 ; dev-box LOW renders at 66% then upscales
[ResolutionQuality@1]
r.ScreenPercentage=75
[ResolutionQuality@2]
r.ScreenPercentage=90
[ResolutionQuality@3]
r.ScreenPercentage=100
[ResolutionQuality@Cine]
r.ScreenPercentage=100
